# Local development without a real Supabase project: an in-memory H2 database so
# `mvn spring-boot:run` works out of the box. Photo uploads still need a real
# Supabase Storage bucket configured via the SUPABASE_* env vars — H2 only
# stands in for the database, not Storage.
spring:
  datasource:
    url: jdbc:h2:mem:vehicleinventory;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

logging:
  level:
    com.dealerhub.inventory: DEBUG
