<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle — Vehicle Inventory</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <h1>Vehicle Inventory</h1>
    <nav>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/vehicles.html">Vehicles</a>
      <a href="/vehicle-form.html" class="active">Add Vehicle</a>
    </nav>
    <button class="secondary logout-btn" id="logout-btn">Sign out</button>
  </aside>
  <main class="main">
    <h2 id="form-title">Add vehicle</h2>
    <div id="alert-box"></div>

    <form id="vehicle-form" class="form-grid">
      <div class="field"><label>Brand</label><input name="brand" required></div>
      <div class="field"><label>Model</label><input name="model" required></div>
      <div class="field"><label>Year</label><input name="year" type="number" required></div>
      <div class="field"><label>Engine</label><input name="engine" placeholder="e.g. 2.5L I4"></div>
      <div class="field"><label>VIN</label><input name="vin" maxlength="17" required></div>
      <div class="field"><label>Mileage</label><input name="mileage" type="number" required></div>
      <div class="field"><label>Purchase price</label><input name="purchasePrice" type="number" step="0.01" required></div>
      <div class="field"><label>Selling price</label><input name="sellingPrice" type="number" step="0.01"></div>
      <div class="field"><label>Status</label><select name="status" id="status-select"></select></div>
      <div class="field"><label>Condition</label><select name="condition" id="condition-select" required></select></div>
      <div class="field full"><label>Notes</label><textarea name="notes" rows="3"></textarea></div>

      <div class="form-actions full">
        <button type="submit" id="save-btn">Save vehicle</button>
        <a class="btn secondary" href="/vehicles.html">Cancel</a>
        <button type="button" class="danger" id="delete-btn" style="display:none">Delete vehicle</button>
      </div>
    </form>

    <div class="card" id="photos-card" style="display:none; margin-top:24px; max-width:720px">
      <h3 style="margin-top:0">Photos</h3>
      <div class="photo-grid" id="photo-grid"></div>
      <input type="file" id="photo-input" accept="image/*" multiple>
      <button type="button" id="upload-photos-btn">Upload</button>
      <p class="muted" style="font-size:12.5px">The first photo uploaded becomes the primary (list/dashboard thumbnail) automatically; change it any time with "Make primary".</p>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/vehicle-form.js"></script>
</body>
</html>
